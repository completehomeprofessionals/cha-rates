name: Update mortgage rates

on:
  schedule:
    # Weekdays at 9:23 AM and 3:23 PM Central (FRED posts new values with a short lag)
    - cron: "23 14,20 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" to update on demand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest rates from FRED
        run: python scripts/update_rates.py
      - name: Save changes
        run: |
          if git diff --quiet data.json; then
            echo "No new data."
          else
            git config user.name "rate-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update mortgage rates"
            git push
          fi
