name: Update market data

on:
  schedule:
    # Every day at 7:41 AM Central: new Notion rows show up the next morning;
    # Realtor.com/FRED data changes once a month.
    - cron: "41 13 * * *"
  workflow_dispatch: {}   # "Run workflow" button to update right away

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Local vs. national (Realtor.com via FRED)
        continue-on-error: true
        run: python scripts/update_compare.py
      - name: Monthly MLS stats (Notion)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/update_market_stats.py
      - name: Save changes
        run: |
          if [ -z "$(git status --porcelain compare monthly)" ]; then
            echo "No new data."
          else
            git config user.name "rate-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add compare/data.json monthly/data.json
            git commit -m "Update market data"
            git push
          fi
